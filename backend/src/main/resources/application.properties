spring.application.name=fixed-income-risk
server.port=8080
spring.threads.virtual.enabled=true

# Hull-White one-factor parameters.
risk.hull-white.a=0.05
risk.hull-white.sigma=0.01

# Correlated drivers: each tick's shocks to the short rate, the Systemic Factor and the
# futures Basis, correlated through this matrix (rows separated by ';', in that order). Validated at startup:
# symmetric, unit diagonal, positive definite. Flight to quality: rates tend to fall as spreads widen.
# Everything else (Sector and Idiosyncratic Factors, Credit Events, CTD Switches, Prints) stays independent.
risk.correlation.matrix=1,-0.3,0.1; -0.3,1,0; 0.1,0,1

# Treasury futures. The Basis, in price points per 100 face, follows
# dB = kappa (long-run-mean - B) dt + eta dW, with time in years. CTD Switches arrive as a Poisson process at
# `intensity` per contract per year; each replaces the Proxy Bond and jumps the Basis by +/- `basis-jump`.
risk.futures.basis.kappa=12
risk.futures.basis.long-run-mean=-0.20
risk.futures.basis.eta=0.5
risk.futures.ctd-switch.intensity=24
risk.futures.ctd-switch.basis-jump=0.15

# Credit factor hierarchy: OU processes in basis points, time in years. The Systemic Factor is
# slow and wide, Sector Factors moderate, Idiosyncratic Factors small and fast. Sector and Idiosyncratic
# long-run means are reference data (rating-buckets.csv, issuers.csv), as are each issuer's Print and Quote
# intensities and noise.
risk.credit.systemic.kappa=0.5
risk.credit.systemic.long-run-mean-bp=60
risk.credit.systemic.sigma-bp=40
risk.credit.sector.kappa=2
risk.credit.sector.sigma-bp=25
risk.credit.idiosyncratic.kappa=20
risk.credit.idiosyncratic.sigma-bp=15

# Credit Events: Poisson spread jumps per issuer per year (exponential, mean
# jump-mean-bp, decaying at jump-decay per year) that may downgrade the issuer by up to max-notches rating
# grades. The jump is latent; a Print burst (x print-burst-multiplier, decaying at print-burst-decay per
# year) lets the Mark catch up. `scheduled` forces events for a rehearsed demo, e.g. ACME@120:80:1 means
# Acme jumps 80bp and is downgraded one grade on tick 120.
risk.credit.events.intensity=3
risk.credit.events.jump-mean-bp=60
risk.credit.events.jump-decay=0.5
risk.credit.events.migration-probability=0.5
risk.credit.events.max-notches=1
risk.credit.events.print-burst-multiplier=30
risk.credit.events.print-burst-decay=100
risk.credit.events.scheduled=

# Pillars: the curve tenors reported on the chart and at which Bucketed DV01 is measured.
risk.pillars=3M,1Y,2Y,3Y,5Y,7Y,10Y,20Y,30Y

# Selective repricing. An Instrument is repriced only when a Risk Factor it
# depends on has moved past its Materiality Threshold since it was last priced; Day Rollover always
# reprices everything. At 1h per tick the short end moves about 1bp per tick, so a threshold well below
# that reprices everything every tick.
risk.materiality.pillar-zero-rate-bp=2
# Threshold on an issuer's Mark, in bp. Matrix Pricing moves Marks about 0.5bp per tick at 1h per tick.
risk.materiality.mark-bp=1
# Threshold on the Systemic and Sector Factors, which corporate bonds depend on through Matrix Pricing.
risk.materiality.credit-index-bp=1
# Threshold on a futures Basis, in price points. At 1h per tick the Basis moves about 0.005 points per tick.
risk.materiality.basis-points=0.02
# An Instrument depends on a Pillar only if the Pillar carries at least this share of its Bucketed DV01.
risk.repricing.min-pillar-exposure=0.05
# Runtime: a simulation thread ticks independently of a repricing thread,
# which prices the newest market on this many worker threads. If a cycle overruns a tick, the missed ticks
# are coalesced. `cycle-delay` artificially slows each repricing cycle to make coalescing visible in a demo.
risk.repricing.worker-threads=4
risk.repricing.cycle-delay=0ms

# Curve Source: `treasury` (default) fetches today's curve from the US Treasury, caching it to disk, and
# falls back to the cache and then to the bundled snapshot; `bundled` always uses the snapshot, for a
# reproducible run.
risk.curve.source=treasury
risk.curve.treasury-base-url=https://home.treasury.gov
risk.curve.cache-file=${user.home}/.fixed-income-risk/treasury-par-curve.csv

# Simulation. Leave the seed blank for a random seed; it is logged at startup
# and shown in the UI, so any run can be replayed.
risk.simulation.seed=
risk.simulation.simulated-time-per-tick=1h
# Ticks per simulated day: every this many ticks a Day Rollover advances the Valuation Date by one day,
# ageing the Book and processing coupons. Independent of the step above; 24 x 1h keeps the
# Valuation Date in line with model time.
risk.simulation.ticks-per-day=24
risk.simulation.tick-interval=1s
# Freeze the run after a given tick; the stream stays open on the final state. Unset: run indefinitely.
# risk.simulation.stop-at-tick=120

# The risk stream is a long-lived async response; never time it out.
spring.mvc.async.request-timeout=-1ms
