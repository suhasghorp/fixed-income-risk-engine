# Spring Framework reads this file at startup (SpringProperties), before any application configuration.
#
# Since Spring Framework 7, the output stream handed to a StreamingResponseBody ignores flush(): bytes leave
# only when the servlet container's buffer (8KB) fills. The risk stream writes one Server-Sent Event at a
# time and flushes it, and each event must reach the browser at once. Without this flag, every event's tail
# waits for the next write, so the UI runs one Risk Update behind, and a stopped run never delivers its last
# state. StoppedStreamTest guards this.
spring.http.response.flush.enabled=true
