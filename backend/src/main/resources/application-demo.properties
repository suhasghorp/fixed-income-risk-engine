# The reproducible demo used throughout the article series: run with --spring.profiles.active=demo.
# Every run is identical: the bundled Treasury curve (not today's live one), a fixed seed, and a scheduled
# Credit Event (Acme is downgraded on tick 120). Random Credit Events stay on; under a fixed seed they are
# deterministic too. Add --risk.simulation.stop-at-tick=N to freeze the run at tick N.
risk.curve.source=bundled
# The EUR curve likewise: the bundled ECB snapshot, no network, no cache.
risk.curve.eur.source=bundled
risk.simulation.seed=42
risk.simulation.simulated-time-per-tick=1h
risk.simulation.ticks-per-day=24
risk.simulation.tick-interval=1s
risk.credit.events.scheduled=ACME@120:80:1
