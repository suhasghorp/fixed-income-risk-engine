# The reproducible demo used throughout the article series: run with --spring.profiles.active=demo.
# Every run is identical: the bundled Treasury curve (not today's live one), a fixed seed, a scheduled
# Credit Event (Acme is downgraded on tick 120) and a scheduled CTD Switch (the ZN contract moves to its
# third deliverable on tick 878). Random Credit Events and CTD Switches stay on; under a fixed seed they
# are deterministic too. Add --risk.simulation.stop-at-tick=N to freeze the run at tick N.
risk.curve.source=bundled
# The EUR curve likewise: the bundled ECB snapshot, no network, no cache.
risk.curve.eur.source=bundled
risk.simulation.seed=42
risk.simulation.simulated-time-per-tick=1h
risk.simulation.ticks-per-day=24
risk.simulation.tick-interval=1s
risk.credit.events.scheduled=ACME@120:80:1
# The moment article 6 is written around. Scheduled rather than drawn, so the article's Tick stops moving
# every time the random stream shifts. No switch is drawn for ZNZ6 on this Tick, so scheduling one
# consumes no extra randomness and the rest of the run is unchanged.
risk.futures.ctd-switch.scheduled=ZNZ6@878:CTD3
